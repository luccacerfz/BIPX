<!doctype html><html lang="en"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Death cut comparison</title>
<style>body{margin:0;background:#263442;color:white;font:16px system-ui}canvas{display:block}#label{position:fixed;left:20px;top:20px;padding:12px;background:#142030e8;white-space:pre}#note{position:fixed;bottom:20px;left:20px;background:#142030e8;padding:10px}</style>
<div id="label">Loading</div><div id="note">Native asset fixture · before / falling capped candidate · not gameplay</div>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import {loadEnemyLibrary} from '../src/assets/enemy-library.js';
import {loadMonsterLibrary} from '../src/assets/monster-library.js';
import {createEnemyDeathCut as beforeCut} from '../src/assets/enemy-death-cut.js?variant=before';
import {createEnemyDeathCut as candidateCut} from '../src/assets/enemy-death-cut.js?variant=candidate';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.localClippingEnabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#263442');scene.add(new THREE.HemisphereLight('#f0f6ff','#4b392c',2.5));const sun=new THREE.DirectionalLight('#ffe8c6',3);sun.position.set(5,10,-4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#687c83',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;floor.receiveShadow=true;scene.add(floor,new THREE.GridHelper(200,200,'#90a6af','#455c66'));
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,200);camera.position.set(4.8,3.3,-7.8);camera.lookAt(0,1.15,0);
const orcs=await loadEnemyLibrary({THREE}),monsters=await loadMonsterLibrary({THREE});let actor,cut,type,variant,time=0,playback=0,quality='high';
function render(){renderer.render(scene,camera);document.querySelector('#label').textContent=`${type} · ${variant} · ${quality}\ndeath age ${time.toFixed(3)} s · ${playback}x playback\n${cut?.diagnostics?`caps ${cut.diagnostics.capTriangles} tris · floor minima ${cut.parts.map(p=>p.minimumY.toFixed(3)).join(' / ')} m`:'v2 suspended halves baseline'}`;}
function configure(options){playback=0;cut?.dispose();actor?.dispose();type=options.type;variant=options.variant;quality=options.quality||'high';time=0;const lib=type==='orcPeon'?orcs:monsters;actor=lib.create(type,{parent:scene,height:2.6});for(let i=0;i<68;i++)actor.update(1/120,{speed:3.7});cut=(variant==='before'?beforeCut:candidateCut)({THREE,source:actor.root,scene,direction:{x:0,z:-1}});cut.update(0,{quality});render();}
function step(dt){time+=dt;cut.update(dt,{quality});render();}
const snapshot=()=>({type,variant,quality,time,diagnostics:cut.diagnostics||null,parts:cut.parts.map(p=>({minimumY:p.minimumY,grounded:p.grounded,angle:p.angle,position:p.pivot.position.toArray()})),glError:renderer.getContext().getError()});
window.cutFixture={ready:true,configure,step,snapshot,play:value=>{playback=value;render();},side:()=>{camera.position.set(-5,3.5,-7);camera.lookAt(0,1.15,0);render();}};
configure({type:'orcPeon',variant:'candidate'});let previous=performance.now();function tick(now){const dt=Math.min(.05,(now-previous)/1000)*playback;previous=now;if(dt>0)step(dt);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
