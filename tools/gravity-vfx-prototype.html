<!doctype html><html lang="pt-BR"><meta charset="utf-8"><base href="/"><link rel="icon" href="data:,"><title>BIPX · Gravidade A/B isolado</title>
<style>html,body{margin:0;overflow:hidden;background:#10212b;color:#e7e2f2;font:13px system-ui}header{position:fixed;top:18px;left:20px;right:20px;display:flex;pointer-events:none}header div{width:50%;padding:10px;background:#07151cc9;box-sizing:border-box}strong{display:block;font-size:17px;margin-bottom:4px}footer{position:fixed;bottom:16px;left:20px;background:#07151cd9;padding:9px;pointer-events:none}#panels{display:flex}#panels canvas{display:block;width:50vw;height:100vh}header{z-index:1}footer{z-index:1}</style>
<header><div><strong>ATUAL · campo em runtime</strong>Mesmos assets, raio e câmera</div><div><strong>PROTÓTIPO · Horizon + nebula original</strong>Isolado · não promovido ao gameplay</div></header><footer id="label"></footer>
<div id="panels"><canvas id="left"></canvas><canvas id="right"></canvas></div>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import {createCemetery} from '../src/render/cemetery.js';
import {getEnvironmentLayout} from '../src/render/environment-layout.js';
import {loadAssetDressing} from '../src/render/asset-dressing.js';
import {loadPlayableCharacter} from '../src/assets/playable-characters.js';
import {loadMonsterLibrary} from '../src/assets/monster-library.js';
import {createClassSkillVfx} from '../src/vfx/class-skill-vfx.js';
import {createGravityHorizonNebulaPrototype} from '../src/vfx-prototype/gravity-horizon-nebula.js';
import {createCinematicPipeline} from '../src/render/cinematic-pipeline.js';
const width=innerWidth/2,height=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(width,height);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.localClippingEnabled=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const panels=['left','right'].map(id=>{const c=document.getElementById(id);c.width=width;c.height=height;return c.getContext('2d',{alpha:false});});
const pipeline=createCinematicPipeline({THREE,renderer});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x172c34);scene.fog=new THREE.FogExp2(0x172c34,.012);scene.add(new THREE.HemisphereLight(0xa4cddc,0x233d3a,2.2));const moon=new THREE.DirectionalLight(0xb6dcf2,3.8);moon.position.set(-20,36,18);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);Object.assign(moon.shadow.camera,{near:1,far:95,left:-55,right:55,top:55,bottom:-55});moon.shadow.bias=-.0005;scene.add(moon);
const cemetery=createCemetery({THREE,scene}),ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),cemetery.groundMaterial);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const trees=getEnvironmentLayout().legacy.filter(c=>c.id.startsWith('tree')).map(c=>new THREE.Vector3(c.x,0,c.z));const world=await loadAssetDressing({THREE,scene,trees,lanterns:cemetery.lanternPositions});for(const p of cemetery.lanternPlaceholders)p.visible=false;
const heroGroup=new THREE.Group();heroGroup.position.set(-2,0,2);scene.add(heroGroup);const hero=await loadPlayableCharacter('dwarf',{THREE,parent:heroGroup});
const playerLight=new THREE.PointLight(0xffe2ab,5.2,24);playerLight.position.set(-2,4.5,2);scene.add(playerLight);
const library=await loadMonsterLibrary({THREE});const actors=[];
for(const [x,z]of [[0,-4],[-2.5,-5.6],[2.5,-2.6],[.8,-7.1]]){const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);actors.push({group,visual:library.create('zombie',{parent:group,height:2.55})});}
const camera=new THREE.PerspectiveCamera(48,(innerWidth/2)/innerHeight,.1,220);camera.position.set(-2,17,22);camera.lookAt(-2,1.2,-.6);
const baselineRoot=new THREE.Group();scene.add(baselineRoot);const baseline=createClassSkillVfx({THREE,scene:baselineRoot,quality:'high'});const candidate=createGravityHorizonNebulaPrototype(THREE,scene);
const center=new THREE.Vector3(0,0,-4);let time=0,quality='high',reduced=false,playing=false;
// Fixture-only RGBA depth pass. Production compositor remains untouched.
const depthTarget=new THREE.WebGLRenderTarget(width,height,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});
const depthMaterials=new Map();
function depthFor(material){let depth=depthMaterials.get(material);if(!depth){depth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,blending:THREE.NoBlending,side:material.side,map:material.map,alphaMap:material.alphaMap,alphaTest:material.alphaTest});depthMaterials.set(material,depth);}depth.clippingPlanes=material.clippingPlanes;depth.clipIntersection=material.clipIntersection;return depth;}
let depthRender={},renderCost={};
function prepass(){
 const oldBackground=scene.background,hidden=[],swapped=[];
 baselineRoot.visible=false;candidate.group.visible=false;
 scene.traverseVisible(o=>{if(!o.isMesh)return;const materials=Array.isArray(o.material)?o.material:[o.material];
 if(materials.every(m=>m.depthWrite===false||(m.transparent&&m.opacity<.99)||m.blending===THREE.AdditiveBlending)){hidden.push(o);o.visible=false;return;}
 swapped.push([o,o.material]);o.material=Array.isArray(o.material)?materials.map(depthFor):depthFor(o.material);});
 scene.background=null;
 renderer.setClearColor(0xffffff,1);renderer.info.reset();renderer.setRenderTarget(depthTarget);renderer.clear();renderer.render(scene,camera);depthRender={...renderer.info.render};
 scene.background=oldBackground;for(const [o,m]of swapped)o.material=m;for(const o of hidden)o.visible=true;renderer.setRenderTarget(null);
 candidate.setSceneDepth({texture:depthTarget.texture,width,height,near:camera.near,far:camera.far});
}
function renderSide(side,effect=true,copy=false){
 if(effect&&side===1&&time<5)prepass();
 baselineRoot.visible=effect&&side===0;candidate.group.visible=effect&&side===1&&time<5;
 pipeline.render(scene,camera,0);renderCost={...renderer.info.render};
 if(copy)panels[side].drawImage(renderer.domElement,0,0);
}
function render(effect=true){
 for(let side=0;side<2;side++)renderSide(side,effect,true);
 document.querySelector('#label').textContent=`Fixture controlada com assets reais · HDR${quality==='high'?' + bloom':''} real · 1 renderer / 2 cópias canvas · t=${time.toFixed(2)} / 5 s · raio 5 m · ${quality}${reduced?' / reduced':''}`;
}
function step(dt,draw=true){time+=dt;const remaining=Math.max(0,5-time);baseline.syncState({fields:remaining?[{id:'comparison',position:center,radius:5,remaining,duration:5}]:[]});baseline.update(dt);candidate.update(dt);
 hero.update(dt,{speed:0,grounded:true});for(const a of actors)a.visual.update(dt,{speed:0});
 world.update(heroGroup.position,true,actors.map(a=>({health:1,mesh:a.group,radius:.6})),[],remaining?[{skillId:'dwarf_gravity_shot',castId:'comparison',...center,radius:5,remaining}]:[]);if(draw)render();}
function sample(t,q='high',rm=false){playing=false;quality=q;reduced=rm;pipeline.setQuality(q);pipeline.setReducedMotion(rm);time=0;baseline.reset();baseline.setQuality(q);baseline.setReducedMotion(rm);candidate.set({position:center,radius:5,remaining:5,duration:5,quality:q,reducedMotion:rm});for(let i=0;i<t-1e-7;i+=1/60)step(Math.min(1/60,t-i),false);step(0);return stats();}
function stats(){return {time,quality,reduced,camera:{fov:camera.fov,position:camera.position.toArray(),target:[-2,1.2,-.6],perPanelAspect:camera.aspect},baseline:baseline.getStats(),prototype:candidate.getStats(),pipeline:pipeline.getStats(),depthPrepass:{encoding:'RGBADepthPacking',fixtureOnly:true,width,height,render:depthRender},world:world.stats,memory:{...renderer.info.memory},render:renderCost,glError:renderer.getContext().getError()};}
function pixels(){const data=new Uint8Array(width*height*4);renderer.getContext().readPixels(0,0,width,height,renderer.getContext().RGBA,renderer.getContext().UNSIGNED_BYTE,data);return data;}
function audit(){renderSide(1,false);const before=pixels();renderSide(1,true);const after=pixels();render();const result=[];
 for(const [index,a]of actors.entries()){
  const p=a.group.position.clone().add(new THREE.Vector3(0,1.7,0)).project(camera);let count=0,preserved=0;
  const cx=Math.round((p.x*.5+.5)*width),cy=Math.round((p.y*.5+.5)*height);
  for(let y=cy-5;y<=cy+5;y++)for(let x=cx-5;x<=cx+5;x++){if(x<0||x>=width||y<0||y>=height)continue;const i=(y*width+x)*4;const delta=Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2]);count++;if(delta<65)preserved++;}
  result.push({index,preservedFraction:count?preserved/count:null,pixels:count});
 }return result;
}
async function measureCost(){
 playing=false;const gl=renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');const cases=[];
 for(const [q,rm]of [['high',false],['low',true]])for(const kind of ['baseline','candidate','depth-only']){
  sample(1.8,q,rm);const cpu=[],gpu=[],intervals=[];let last=performance.now(),disjoint=false;
  for(let i=0;i<42;i++){
   await new Promise(requestAnimationFrame);const now=performance.now();intervals.push(now-last);last=now;
   const query=ext?gl.createQuery():null;if(query)gl.beginQuery(ext.TIME_ELAPSED_EXT,query);
   const start=performance.now();if(kind==='depth-only')prepass();else renderSide(kind==='baseline'?0:1,true,false);cpu.push(performance.now()-start);
   if(query){gl.endQuery(ext.TIME_ELAPSED_EXT);while(!gl.getQueryParameter(query,gl.QUERY_RESULT_AVAILABLE))await new Promise(requestAnimationFrame);const bad=gl.getParameter(ext.GPU_DISJOINT_EXT);disjoint ||=bad;if(!bad)gpu.push(gl.getQueryParameter(query,gl.QUERY_RESULT)/1e6);gl.deleteQuery(query);}
  }
  const summary=a=>{a=a.slice(6).sort((a,b)=>a-b);return {samples:a.length,p50:a[Math.floor(a.length*.5)]??null,p95:a[Math.floor(a.length*.95)]??null,max:a.at(-1)??null};};
  cases.push({quality:q,reduced:rm,kind,cpuSubmissionMs:summary(cpu),gpuElapsedMs:summary(gpu),rafIntervalsIncludingQueryWaitMs:summary(intervals),gpuDisjoint:disjoint,draws:{pipeline:renderCost,depth:depthRender}});
 }
 sample(1.8);return {resolution:[width,height],timerQueryAvailable:!!ext,method:'42 renders per case; first 6 warmup discarded; no panel copies in measurements; candidate includes fixture depth pass',cases};
}
window.gravityVfxPrototype={ready:true,sample,step,stats,audit,measureCost,play(q='high',rm=false){sample(0,q,rm);playing=true;},stop(){playing=false;},dispose(){baseline.dispose();candidate.dispose();render(false);pipeline.dispose();depthTarget.dispose();for(const m of depthMaterials.values())m.dispose();return {baseline:baseline.getStats(),prototype:candidate.getStats()};}};
sample(1.8);let previous=performance.now();function tick(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(playing){step(dt);if(time>=5.3)playing=false;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
