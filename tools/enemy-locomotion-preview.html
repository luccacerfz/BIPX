<style>html,body{margin:0;background:#111719;color:#dae3dd;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;top:12px;left:16px;padding:12px;background:#172022e8;border-radius:8px}small{display:block;opacity:.75;margin-top:5px}#stats{white-space:pre;font:12px monospace}</style>
<aside><strong>Orc Peon · original à esquerda / Mixamo à direita</strong><small>Fixture real dos assets; não é captura de gameplay</small><p>Velocidade <input id="speed" type="range" min="0" max="6" step=".1" value="3.7"> <output id="value">3.7 m/s</output> <button id="attack">Ataque</button></p><div id="stats"></div></aside>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import {loadEnemyLibrary} from '../src/assets/enemy-library.js';
import {loadGlb} from '../src/assets/load-glb.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#172022');scene.fog=new THREE.Fog('#172022',13,35);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,80);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdfeaff,0x3b3328,2.2));const key=new THREE.DirectionalLight(0xffe7c1,3);key.position.set(3,8,5);key.castShadow=true;scene.add(key);scene.add(key.target);key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-9;key.shadow.camera.right=9;key.shadow.camera.top=9;key.shadow.camera.bottom=-9;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,400),new THREE.MeshStandardMaterial({color:0x39403b,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.z=-130;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(300,300,0x788875,0x53604f);scene.add(grid);
const left=new THREE.Group(),right=new THREE.Group();left.position.x=-1.6;right.position.x=1.6;scene.add(left,right);
const lib=await loadEnemyLibrary({THREE}),actor=lib.create('orcPeon',{parent:right,height:2.5});
const original=await loadGlb(new URL('../assets/models/orc-peon.glb',import.meta.url));const model=original.scene;model.rotation.y=Math.PI;left.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});const mixer=new THREE.AnimationMixer(model),actions=Object.fromEntries(original.animations.map(c=>[c.name,mixer.clipAction(c)]));actions.Idle.play();mixer.update(0);model.updateMatrixWorld(true);const body=model.getObjectByName('OrcBody');body.skeleton.update();const bounds=new THREE.Box3().setFromObject(body,true);left.scale.setScalar(2.5/bounds.getSize(new THREE.Vector3()).y);model.position.y-=bounds.min.y;let active=actions.Idle;
const clock=new THREE.Clock();let distance=0,frame=0;function loop(){const dt=Math.min(.033,clock.getDelta()),speed=Number(document.querySelector('#speed').value);distance+=speed*dt;if(distance>100)distance=0;left.position.z=right.position.z=-distance;const clip=speed>.08?'Walk':'Idle';if(active!==actions[clip]){active.fadeOut(.12);active=actions[clip];active.reset().fadeIn(.12).play();}if(clip==='Walk')active.setEffectiveTimeScale(THREE.MathUtils.clamp(speed/(.41087*left.scale.x),.6,2.8));mixer.update(dt);actor.update(dt,{speed,velocity:{x:0,z:-speed}});camera.position.set(7,4.2,8-distance);camera.lookAt(0,1.2,-distance);key.position.set(3,8,5-distance);key.target.position.z=-distance;renderer.render(scene,camera);if(frame++%12===0){document.querySelector('#value').textContent=`${speed.toFixed(1)} m/s`;document.querySelector('#stats').textContent=`Original: ${clip} · ${active.getEffectiveTimeScale().toFixed(2)}×\nCandidato: ${actor.stats.currentClip} · ${actor.stats.animationTimeScale.toFixed(2)}×`;}requestAnimationFrame(loop);}loop();document.querySelector('#attack').onclick=()=>actor.attack({duration:.85});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});window.orcLocomotion={actor,original,scene,renderer,camera};
</script>
