<!doctype html><html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Sole transition A/B</title><style>body{margin:0;background:#263442;color:#fff;font:14px system-ui}.label{position:fixed;top:12px;padding:10px;background:#102038ed;white-space:pre}#before{left:12px}#candidate{left:calc(50% + 12px)}#note{position:fixed;bottom:10px;left:12px;padding:8px;background:#102038ed}</style><div id="before" class="label"></div><div id="candidate" class="label"></div><div id="note">Native asset fixture · before df93 / isolated candidate · actual skin surface probes · NOT gameplay/no-slide approval</div><script type="module">
import * as THREE from '../vendor/three/three.module.js';
import {loadHeroVisual as beforeHero} from '../src/assets/character-library.js?variant=before';
import {loadDwarfVisual as beforeDwarf} from '../src/assets/dwarf-library.js?variant=before';
import {loadHeroVisual as afterHero} from '../src/assets/character-library.js?variant=candidate';
import {loadDwarfVisual as afterDwarf} from '../src/assets/dwarf-library.js?variant=candidate';
import {heroFootProbes} from '../src/assets/hero-foot-probes.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.setScissorTest(true);document.body.append(renderer.domElement);
const sides=['before','candidate'].map(id=>{const scene=new THREE.Scene();scene.background=new THREE.Color('#263442');scene.add(new THREE.HemisphereLight('#f0f6ff','#493c30',2.5));const sun=new THREE.DirectionalLight('#ffe9d3',3);sun.position.set(5,9,-4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;scene.add(sun,sun.target);const plane=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:'#637880',roughness:1}));plane.rotation.x=-Math.PI/2;plane.position.y=-.002;plane.receiveShadow=true;scene.add(plane,new THREE.GridHelper(2000,4000,'#acbfc2','#4a606b'));const parent=new THREE.Group();scene.add(parent);return{id,scene,sun,parent,camera:new THREE.PerspectiveCamera(38,innerWidth/2/innerHeight,.05,3000),actor:null,previous:null};});
let settings={character:'warrior',scenario:'strafe',view:'close'},time=0,playback=0,until=0,accumulator=0,casted=false,trace=[];
function sample(side){const {actor}=side;actor.root.updateMatrixWorld(true);const points=heroFootProbes[settings.character].feet.map(foot=>foot.map(p=>{const mesh=actor.model.getObjectByName(p.mesh);mesh.skeleton.update();return{...p,position:mesh.getVertexPosition(p.vertex,new THREE.Vector3()).applyMatrix4(mesh.matrixWorld).toArray()};}));const bones={};actor.model.traverse(o=>{if(o.isBone)bones[o.name.replace(/^mixamorig:?/,'').replace(/_\d+$/,'')]=o;});const inverse=bones.Hips.matrixWorld.clone().invert(),upper=[];for(const object of [bones.Spine,bones.Head,bones.LeftHand,bones.RightHand,actor.weapon,actor.shield].filter(Boolean))upper.push(...new THREE.Matrix4().multiplyMatrices(inverse,object.matrixWorld).elements);return{feet:structuredClone(actor.stats.locomotion.footContacts),points,upper,rootY:actor.root.position.y,gait:actor.stats.locomotion.gait,clip:actor.stats.currentClip,cast:structuredClone(actor.stats.cast),finite:upper.every(Number.isFinite)};}
function motion(){if(settings.scenario==='strafe')return{speed:6.5,angle:Math.PI/2};if(settings.scenario==='fast-backward')return{speed:9.1,angle:Math.PI};const speed=time<.35?time/.35*6.5:time<3.3?6.5:time<3.75?6.5*(3.75-time)/.45:0;const angle=time<1.1?0:time<1.6?(time-1.1)/.5*Math.PI/2:Math.PI/2;return{speed,angle};}
function step(dt){const m=motion(),velocity={x:Math.sin(m.angle)*m.speed,z:-Math.cos(m.angle)*m.speed};if(settings.scenario==='turn-cast-stop'&&!casted&&time>=2){const skillId=settings.character==='warrior'?'warrior_shield_charge':'dwarf_explosive_cannon';for(const s of sides)s.actor.cast({skillId,castId:'transition-cast'});casted=true;}for(const s of sides){s.parent.position.x+=velocity.x*dt;s.parent.position.z+=velocity.z*dt;s.parent.updateMatrixWorld(true);s.actor.update(dt,{speed:m.speed,velocity});}time+=dt;const samples=sides.map(sample);const flagMatch=JSON.stringify(samples[0].feet.map(f=>f.contact))===JSON.stringify(samples[1].feet.map(f=>f.contact));const upperDelta=Math.max(0,...samples[0].upper.map((v,i)=>Math.abs(v-samples[1].upper[i])));const transitions=[];for(let side=0;side<2;side++){const prior=sides[side].previous,current=samples[side];if(prior)for(let foot=0;foot<2;foot++){if(!current.feet[foot]||!prior.feet[foot]||current.feet[foot].contact===prior.feet[foot].contact)continue;const old=prior.points[foot].reduce((a,b)=>a.position[1]<b.position[1]?a:b),point=current.points[foot].find(p=>p.vertex===old.vertex&&p.mesh===old.mesh);transitions.push({variant:sides[side].id,foot,kind:current.feet[foot].contact?'plant':'release',mesh:point.mesh,vertex:point.vertex,from:old.position,to:point.position,horizontalSpeed:Math.hypot(point.position[0]-old.position[0],point.position[2]-old.position[2])/dt});}sides[side].previous=current;}trace.push({time,speed:m.speed,flagMatch,upperDelta,transitions,samples:samples.map(s=>({feet:s.feet,gait:s.gait,clip:s.clip,cast:s.cast,rootY:s.rootY,finite:s.finite,minimumProbeY:Math.min(...s.points.flat().map(p=>p.position[1]))}))});}
function render(){sides.forEach((s,i)=>{const game=settings.view==='game';s.camera.fov=game?48:38;s.camera.updateProjectionMatrix();const offset=game?[0,17,20]:settings.view==='body'?[4.8,2.4,-4.8]:[3.3,1.05,-.6];s.camera.position.copy(s.parent.position).add(new THREE.Vector3(...offset));s.camera.lookAt(s.parent.position.clone().add(new THREE.Vector3(0,game?1.2:settings.view==='body'?1.2:.6,game?-2.5:0)));s.sun.position.copy(s.parent.position).add(new THREE.Vector3(5,9,-4));s.sun.target.position.copy(s.parent.position);s.sun.target.updateMatrixWorld();renderer.setViewport(i*innerWidth/2,0,innerWidth/2,innerHeight);renderer.setScissor(i*innerWidth/2,0,innerWidth/2,innerHeight);renderer.render(s.scene,s.camera);document.querySelector('#'+s.id).textContent=`${s.id} · ${settings.character} · ${settings.scenario}\n${settings.view} · t ${time.toFixed(3)}s · ${playback}x\n${s.actor.stats.currentClip} / ${s.actor.stats.locomotion.gait}\n${s.actor.stats.locomotion.footContacts.map(f=>`${f.foot}: ${f.contact?'support':'swing'} sole ${f.surfaceY.toFixed(4)}m reach ${f.reachError.toFixed(3)}m`).join('\n')}`;});}
async function configure(options){playback=0;Object.assign(settings,options);time=0;accumulator=0;casted=false;trace=[];for(const [i,s]of sides.entries()){s.actor?.dispose();s.parent.position.set(0,0,0);s.previous=null;const load=settings.character==='warrior'?(i?afterHero:beforeHero):(i?afterDwarf:beforeDwarf);s.actor=await load({THREE,parent:s.parent,height:settings.character==='warrior'?2.7:2.55});}render();}
window.contactFixture={ready:false,configure,step:(count)=>{for(let i=0;i<count;i++)step(1/120);render();},play:(rate,end)=>{playback=rate;until=end;},view:value=>{settings.view=value;render();},snapshot:()=>({settings,time,playback,trace,glError:renderer.getContext().getError()})};await configure(settings);window.contactFixture.ready=true;let previous=performance.now();function tick(now){accumulator+=Math.min(.05,(now-previous)/1000)*playback;previous=now;while(accumulator>=1/120&&playback>0){step(1/120);accumulator-=1/120;if(time>=until)playback=0;}render();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
