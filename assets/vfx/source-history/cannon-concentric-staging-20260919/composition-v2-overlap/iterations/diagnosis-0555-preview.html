<script type="module">

const scene=new THREE.Scene();scene.background=new THREE.Color(0x172c34);scene.fog=new THREE.FogExp2(0x172c34,.012);scene.add(new THREE.HemisphereLight(0xa4cddc,0x233d3a,2.2));const moon=new THREE.DirectionalLight(0xb6dcf2,3.8);moon.position.set(-20,36,18);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);Object.assign(moon.shadow.camera,{near:1,far:95,left:-55,right:55,top:55,bottom:-55});moon.shadow.bias=-.0005;scene.add(moon);
const cemetery=createCemetery({THREE,scene}),ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),cemetery.groundMaterial);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

actorGroups.forEach((group,index)=>group.traverse(mesh=>{if(!mesh.isMesh)return;const previous=mesh.onBeforeRender;mesh.onBeforeRender=function(r,s,c,g,m,...rest){if(r.getRenderTarget()?.texture.name==='BIPX shared RGBA-packed scene depth'&&m.isMeshDepthMaterial)actorDepthDraws[index]++;previous.call(this,r,s,c,g,m,...rest);};}));

const vfxRoot=new THREE.Group();scene.add(vfxRoot);const vfx=createClassSkillVfx({THREE,scene:vfxRoot,quality:'high'});

const modes=['gravity-before','gravity-after','combined-before','combined-after'];let mode='combined-before',age=0,quality='high',reduced=false,ablation=null,gravityLayer=null,lastDepthFrame=null,overlapLayer=null;
const context=(effect,root)=>({effect,root,fire:root.getObjectByName('CannonVolumetricPool'),states:root.getObjectByName('ClassSkillStates'),gravity:root.getObjectByName('GravityHorizonPool')});
const beforeContext=context(vfx,vfxRoot),afterContext=context(candidate,candidateRoot);

for(const ctx of [beforeContext,afterContext])ctx.gravity.traverse(mesh=>{if(!mesh.isMesh)return;const prior=mesh.onBeforeRender;mesh.onBeforeRender=function(r,s,c,g,m,...rest){if(s===scene&&r.getRenderTarget()?.texture.name!=='BIPX shared RGBA-packed scene depth'){const kind=m.uniforms?.uHole?'gas':m.uniforms?.uHorizon?'horizon':'particles';layerDraws[kind]++;}prior.call(this,r,s,c,g,m,...rest);};});
function proxyFor(ctx){return {prepareSceneDepth(camera){return ctx.effect.prepareSceneDepth(camera);},setSceneDepth(frame){lastDepthFrame=frame;const accepted=ctx.effect.setSceneDepth(frame);ctx.fire.visible=!mode.startsWith('gravity');ctx.states.visible=!ablation;
 if(ablation){ctx.fire.traverse(n=>{if(!n.isMesh)return;if(n.material.uniforms?.uBlastMode){if(n.material.uniforms.uGravityCount)n.material.uniforms.uGravityCount.value=0;n.visible=n.visible&&ablation!=='embers';n.material.uniforms.uSteps.value=ablation==='volume-32'?32:16;}if(n.isInstancedMesh)n.visible=ablation==='embers'||ablation==='fire';});}
 if(gravityLayer){ctx.gravity.traverse(n=>{if(!n.isMesh)return;const u=n.material.uniforms;if(u?.uHole)n.visible=gravityLayer==='gas';else if(u?.uHorizon)n.visible=gravityLayer==='horizon';else n.visible=false;});}
 if(overlapLayer){ctx.states.visible=true;for(const child of ctx.states.children)if(child!==ctx.gravity)child.visible=overlapLayer==='all'||overlapLayer==='particles';ctx.gravity.traverse(n=>{if(!n.isMesh)return;const u=n.material.uniforms,kind=u?.uHole?'gas':u?.uHorizon?'horizon':'particles';n.visible=overlapLayer==='all'||overlapLayer===kind;if(kind==='gas'&&!frame)n.visible=false;});}
 return accepted;}};}
function pixels(){const a=new Uint8Array(width*height*4);renderer.getContext().readPixels(0,0,width,height,renderer.getContext().RGBA,renderer.getContext().UNSIGNED_BYTE,a);return a;}
function renderMode(m,effect=true,copy=false){actorDepthDraws.fill(0);for(const key of Object.keys(layerDraws))layerDraws[key]=0;mode=m;const ctx=m.endsWith('after')?afterContext:beforeContext;vfxRoot.visible=effect&&ctx===beforeContext;candidateRoot.visible=effect&&ctx===afterContext;ctx.fire.visible=true;ctx.states.visible=true;ctx.gravity.visible=true;pipeline.render(scene,camera,0,effect?proxyFor(ctx):null);if(copy)panels[modes.indexOf(m)].drawImage(renderer.domElement,0,0);return {pipeline:pipeline.getStats(),vfx:ctx.effect.getStats(),actorDepthDraws:[...actorDepthDraws],layerDraws:{...layerDraws},composite:{...lastComposite},glError:renderer.getContext().getError()};}
function gate(before,after){return [heroGroup,...actors.map(a=>a.group)].map((a,index)=>{const p=a.position.clone().add(new THREE.Vector3(0,1.7,0)).project(camera),cx=Math.round((p.x*.5+.5)*width),cy=Math.round((p.y*.5+.5)*height);let pixels=0,kept=0;for(let y=cy-5;y<=cy+5;y++)for(let x=cx-5;x<=cx+5;x++){if(x<0||x>=width||y<0||y>=height)continue;const i=(y*width+x)*4;pixels++;if(Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2])<65)kept++;}return {index,pixels,kept,preservedFraction:kept/pixels};});}
function sample(a,q='high',rm=false,offset=0,fieldCount=1){['Gravidade original','Gravidade candidato (máscara original)','Conjunto original','Conjunto candidato por profundidade'].forEach((t,i)=>document.querySelectorAll('label')[i].textContent=t);age=a;quality=q;reduced=rm;for(const pool of [vfx,candidate]){pool.reset();pool.setQuality(q);pool.setReducedMotion(rm);}pipeline.setQuality(q);pipeline.setReducedMotion(rm);const impactClock=contract.clockAtPeak-contract.impactAgeAtPeak;let t=0;while(t<impactClock-1e-8){const d=Math.min(.1,impactClock-t);vfx.update(d);candidate.update(d);t+=d;}const impact=structuredClone(contract.impact);if(offset){const axis=camera.position.clone().sub(new THREE.Vector3(contract.impact.target.x,contract.impact.target.y,contract.impact.target.z)).normalize().multiplyScalar(offset);for(const key of ['origin','target'])if(impact[key]){impact[key].x+=axis.x;impact[key].y+=axis.y;impact[key].z+=axis.z;}}vfx.emit(impact);candidate.emit(impact);t=0;while(t<age-1e-8){const d=Math.min(.1,age-t);vfx.update(d);candidate.update(d);t+=d;}
 const field=contract.gravity;const state={fields:Array.from({length:fieldCount},(_,i)=>({id:i?field.castId+'-'+i:field.castId,position:{x:field.x+i*.035,y:field.y,z:field.z+i*.02},radius:5,duration:5,remaining:field.remaining-(age-contract.impactAgeAtPeak)}))};vfx.syncState(state);candidate.syncState(state);vfx.update(0);candidate.update(0);world.update(heroGroup.position,true,actors.map(a=>({health:100,mesh:a.group,radius:.6})),[],[{skillId:'dwarf_gravity_shot',position:{x:field.x,y:field.y,z:field.z},radius:5,remaining:3}]);
 renderMode('combined-before',false);const before=pixels(),results=[];for(const m of modes){const state=renderMode(m,true,true);results.push({mode:m,...state,gate:gate(before,pixels())});}document.querySelector('#label').textContent=`DIAGNÓSTICO CONTROLADO · idade impacto ${age.toFixed(3)}s · ${q}${rm?' / reduced':''} · raio dano3.4 · depth único · bloom preservado · poses idênticas; deslocamento sintético câmera ${offset}m · sem replay exato`;
 return {age,quality,reduced,fieldCount,syntheticContactOffsetAlongCamera:offset,contract,camera:{position:camera.position.toArray(),target:[-2.59541,1.2,-.154424],fov:camera.fov,aspect:camera.aspect},results};}
for(let i=0;i<60;i++){hero.update(1/60,{speed:0,grounded:true});for(const a of actors)a.visual.update(1/60,{speed:0});}heroGroup.rotation.y=-Math.PI/2;heroGroup.updateMatrixWorld(true);
async function cost(fieldCount=1){const gl=renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');if(!ext)return {available:false,reason:'GPU timer extension unavailable; no CPU timer substituted'};sample(.1505,'high',false,0,fieldCount);const values={'combined-before':[],'combined-after':[]},disjoint=[];const warmup=8,samples=24;for(let n=0;n<warmup+samples;n++)for(const m of (n%2?['combined-after','combined-before']:['combined-before','combined-after'])){const query=gl.createQuery();gl.beginQuery(ext.TIME_ELAPSED_EXT,query);renderMode(m);gl.endQuery(ext.TIME_ELAPSED_EXT);while(!gl.getQueryParameter(query,gl.QUERY_RESULT_AVAILABLE))await new Promise(requestAnimationFrame);if(gl.getParameter(ext.GPU_DISJOINT_EXT))disjoint.push({n,m});else if(n>=warmup)values[m].push(gl.getQueryParameter(query,gl.QUERY_RESULT)/1e6);gl.deleteQuery(query);}return {available:true,fieldCount,quality:'high',resolution:[width,height],warmupPerVariant:warmup,samplesPerVariantRequested:samples,disjoint,milliseconds:values,scope:'Paired alternating full pipeline GPU timing, one burst and1/8overlapping fields. Same scene/quality; not global/mobile/FPS budget'};}
function lifecycle(){const checks=[];sample(.1505,'high',false,0,8);const count=()=>candidate.getStats().cannon.compositionFields;renderMode('combined-after');checks.push({name:'visible8',count:count()});const before=JSON.stringify(candidate.getStats());candidate.update(0);renderMode('combined-after');checks.push({name:'pause',count:count(),sameTime:JSON.parse(before).time===candidate.getStats().time});camera.lookAt(0,40,75);const hidden=renderMode('combined-after');checks.push({name:'offCamera',count:count(),passes:hidden.pipeline.depth.passes});camera.lookAt(-2.59541,1.2,-.154424);sample(.1505,'high',false,0,1);renderMode('combined-after');checks.push({name:'backToOne',count:count()});candidate.reset();vfx.reset();const reset=renderMode('combined-after');checks.push({name:'reset',count:count(),passes:reset.pipeline.depth.passes});candidate.syncState({fields:[{id:'expiry',position:{x:-2.57,y:.08,z:-.117},radius:5,remaining:.05,duration:5}]});candidate.update(0);renderMode('combined-after');checks.push({name:'beforeExpiry',count:count()});candidate.update(.1);const expired=renderMode('combined-after');checks.push({name:'expiry',count:count(),passes:expired.pipeline.depth.passes});candidate.setSceneDepth(null);return {checks,glError:renderer.getContext().getError()};}
function diagnoseLow(){sample(.1505,'low',true);renderMode('combined-before',false);const before=pixels(),results=[];for(const [i,[m,layer]]of [['combined-before','volume'],['combined-after','volume'],['combined-before','volume-32'],['combined-after','volume-32']].entries()){ablation=layer;const state=renderMode(m,true,false);panels[i].drawImage(renderer.domElement,0,0);document.querySelectorAll('label')[i].textContent='Low/reduced '+m+' '+layer;results.push({mode:m,layer,...state,gate:gate(before,pixels())});}ablation=null;document.querySelector('#label').textContent='LOW: original/candidate finest-octave ridge · 16steps top /32steps bottom · same pose/contact/time';return {results};}
function inspectDepth(index=0){
 const subject=actorGroups[index];if(!subject)throw new Error('Unknown actor ROI');
 const frame=lastDepthFrame,rt=new THREE.WebGLRenderTarget(width,height,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,depthBuffer:false,stencilBuffer:false});
 const mat=new THREE.ShaderMaterial({uniforms:{map:{value:frame.texture}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:'varying vec2 vUv;uniform sampler2D map;void main(){gl_FragColor=texture2D(map,vUv);}',depthTest:false,depthWrite:false,blending:THREE.NoBlending,toneMapped:false});
 const temp=new THREE.Scene(),quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat);temp.add(quad);const old=renderer.getRenderTarget();renderer.setRenderTarget(rt);renderer.render(temp,new THREE.Camera());const data=new Uint8Array(width*height*4);renderer.readRenderTargetPixels(rt,0,0,width,height,data);renderer.setRenderTarget(old);quad.geometry.dispose();mat.dispose();rt.dispose();
 const inverse=new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse).invert(),uv=subject.position.clone().add(new THREE.Vector3(0,1.7,0)).project(camera),cx=Math.round((uv.x*.5+.5)*width),cy=Math.round((uv.y*.5+.5)*height),samples=[];
 for(let y=cy-5;y<=cy+5;y++)for(let x=cx-5;x<=cx+5;x++){const i=(y*width+x)*4;const depth=data[i]/4294967296+data[i+1]/16777216+data[i+2]/65536+data[i+3]/256;const v=new THREE.Vector3((x+.5)/width*2-1,(y+.5)/height*2-1,depth*2-1).applyMatrix4(inverse);samples.push({x,y,rgba:[...data.slice(i,i+4)],depth,world:v.toArray()});}

}
function diagnoseEight(bloom=true){

 try{for(const [i,layer]of ['gas','horizon','particles','all'].entries()){overlapLayer=layer;const state=renderMode('gravity-before');panels[i].drawImage(renderer.domElement,0,0);document.querySelectorAll('label')[i].textContent=`8 campos · ${layer} · ${bloom?'bloom real':'sem termo bloom (diagnóstico)'}`;results.push({layer,...state,gate:gate(before,pixels())});}
