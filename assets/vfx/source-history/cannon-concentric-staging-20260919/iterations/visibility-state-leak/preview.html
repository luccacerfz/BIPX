<!doctype html><html lang="pt-BR"><meta charset="utf-8"><base href="/"><link rel="icon" href="data:,"><title>BIPX · Canhão concêntrico · diagnóstico</title>
<style>html,body{margin:0;overflow:hidden;background:#10212b;color:#e7e2f2;font:13px system-ui}header{position:fixed;top:18px;left:20px;right:20px;display:flex;pointer-events:none}header div{width:50%;padding:10px;background:#07151cc9;box-sizing:border-box}strong{display:block;font-size:17px;margin-bottom:4px}footer{position:fixed;bottom:16px;left:20px;background:#07151cd9;padding:9px;pointer-events:none}#panels{display:grid;grid-template-columns:1fr 1fr}#panels canvas{display:block;width:50vw;height:50vh}label{position:absolute;margin:12px;padding:8px;background:#07151ccc}header{z-index:1}footer{z-index:1}</style>
<div id="panels"><div><label>Fogo isolado</label><canvas id="fire"></canvas></div><div><label>Gravidade isolada</label><canvas id="gravity"></canvas></div><div><label>Conjunto atual</label><canvas id="combined"></canvas></div><div><label>Diagnóstico: fogo após campo</label><canvas id="late-fire"></canvas></div></div><footer id="label"></footer>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import {createCemetery} from '../src/render/cemetery.js';
import {getEnvironmentLayout,getEnvironmentColliders} from '../src/render/environment-layout.js';
import {loadAssetDressing} from '../src/render/asset-dressing.js';
import {loadPlayableCharacter} from '../src/assets/playable-characters.js';
import {loadMonsterLibrary} from '../src/assets/monster-library.js';
import {beginSkill,createSkillState,advanceSkills,cancelSkills,getClassSkill} from '../src/combat/class-skills.mjs';
import {createClassSkillVfx} from '../src/vfx/class-skill-vfx.js';
import {shareEnvironmentCutawayDepth} from '../src/render/environment-cutaway.js';
import {createCinematicPipeline} from '../src/render/cinematic-pipeline.js';
const width=innerWidth/2,height=innerHeight/2;
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(width,height);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.localClippingEnabled=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const panels=['fire','gravity','combined','late-fire'].map(id=>{const c=document.getElementById(id);c.width=width;c.height=height;return c.getContext('2d',{alpha:false});});
const pipeline=createCinematicPipeline({THREE,renderer,adaptDepthMaterial:shareEnvironmentCutawayDepth});

const scene=new THREE.Scene();scene.background=new THREE.Color(0x172c34);scene.fog=new THREE.FogExp2(0x172c34,.012);scene.add(new THREE.HemisphereLight(0xa4cddc,0x233d3a,2.2));const moon=new THREE.DirectionalLight(0xb6dcf2,3.8);moon.position.set(-20,36,18);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);Object.assign(moon.shadow.camera,{near:1,far:95,left:-55,right:55,top:55,bottom:-55});moon.shadow.bias=-.0005;scene.add(moon);
const cemetery=createCemetery({THREE,scene}),ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),cemetery.groundMaterial);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const trees=getEnvironmentLayout().legacy.filter(c=>c.id.startsWith('tree')).map(c=>new THREE.Vector3(c.x,0,c.z));const world=await loadAssetDressing({THREE,scene,trees,lanterns:cemetery.lanternPositions});for(const p of cemetery.lanternPlaceholders)p.visible=false;
const heroGroup=new THREE.Group();heroGroup.position.set(0,0,0);scene.add(heroGroup);const hero=await loadPlayableCharacter('dwarf',{THREE,parent:heroGroup});
const playerLight=new THREE.PointLight(0xffe2ab,5.2,24);playerLight.position.set(0,4.5,0);scene.add(playerLight);
const library=await loadMonsterLibrary({THREE});const actors=[];
const contract=await(await fetch('/src/cannon-concentric-contract.json')).json();for(const {x,z}of contract.actors){const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);actors.push({group,visual:library.create('zombie',{parent:group,height:2.55})});}
const camera=new THREE.PerspectiveCamera(48,width/height,.1,220);camera.position.set(0,17,20);camera.lookAt(-2.59541,1.2,-.154424);
const vfxRoot=new THREE.Group();scene.add(vfxRoot);const vfx=createClassSkillVfx({THREE,scene:vfxRoot,quality:'high'});
const modes=['fire','gravity','combined','late-fire'];let mode='combined',age=0,quality='high',reduced=false;
const fire=vfxRoot.getObjectByName('CannonVolumetricPool'),gravity=vfxRoot.getObjectByName('GravityHorizonPool');
const proxy={prepareSceneDepth(camera){return vfx.prepareSceneDepth(camera);},setSceneDepth(frame){const accepted=vfx.setSceneDepth(frame);fire.visible=mode!=='gravity';gravity.visible=mode!=='fire';fire.traverse(n=>{if(n.isMesh){n.userData.originalOrder??=n.renderOrder;n.renderOrder=n.userData.originalOrder+(mode==='late-fire'?32:0);}});return accepted;}};
function pixels(){const a=new Uint8Array(width*height*4);renderer.getContext().readPixels(0,0,width,height,renderer.getContext().RGBA,renderer.getContext().UNSIGNED_BYTE,a);return a;}
function renderMode(m,effect=true,copy=false){mode=m;vfxRoot.visible=effect;pipeline.render(scene,camera,0,effect?proxy:null);if(copy)panels[modes.indexOf(m)].drawImage(renderer.domElement,0,0);return {pipeline:pipeline.getStats(),vfx:vfx.getStats(),glError:renderer.getContext().getError()};}
function gate(before,after){return [heroGroup,...actors.map(a=>a.group)].map((a,index)=>{const p=a.position.clone().add(new THREE.Vector3(0,1.7,0)).project(camera),cx=Math.round((p.x*.5+.5)*width),cy=Math.round((p.y*.5+.5)*height);let pixels=0,kept=0;for(let y=cy-5;y<=cy+5;y++)for(let x=cx-5;x<=cx+5;x++){if(x<0||x>=width||y<0||y>=height)continue;const i=(y*width+x)*4;pixels++;if(Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2])<65)kept++;}return {index,pixels,kept,preservedFraction:kept/pixels};});}
function sample(a,q='high',rm=false){age=a;quality=q;reduced=rm;vfx.reset();vfx.setQuality(q);vfx.setReducedMotion(rm);pipeline.setQuality(q);pipeline.setReducedMotion(rm);const impactClock=contract.clockAtPeak-contract.impactAgeAtPeak;let t=0;while(t<impactClock-1e-8){const d=Math.min(.1,impactClock-t);vfx.update(d);t+=d;}vfx.emit(contract.impact);t=0;while(t<age-1e-8){const d=Math.min(.1,age-t);vfx.update(d);t+=d;}
 const field=contract.gravity;vfx.syncState({fields:[{id:field.castId,position:{x:field.x,y:field.y,z:field.z},radius:5,duration:5,remaining:field.remaining-(age-contract.impactAgeAtPeak)}]});vfx.update(0);world.update(heroGroup.position,true,actors.map(a=>({health:100,mesh:a.group,radius:.6})),[],[{skillId:'dwarf_gravity_shot',position:{x:field.x,y:field.y,z:field.z},radius:5,remaining:3}]);
 renderMode('combined',false);const before=pixels(),results=[];for(const m of modes){const state=renderMode(m,true,true);results.push({mode:m,...state,gate:gate(before,pixels())});}document.querySelector('#label').textContent=`DIAGNÓSTICO CONTROLADO · idade impacto ${age.toFixed(3)}s · ${q}${rm?' / reduced':''} · raio dano3.4 · depth único · bloom preservado · poses idênticas entre painéis, sem replay exato`;
 return {age,quality,reduced,contract,camera:{position:camera.position.toArray(),target:[-2.59541,1.2,-.154424],fov:camera.fov,aspect:camera.aspect},results};}
for(let i=0;i<60;i++){hero.update(1/60,{speed:0,grounded:true});for(const a of actors)a.visual.update(1/60,{speed:0});}heroGroup.rotation.y=-Math.PI/2;heroGroup.updateMatrixWorld(true);
window.cannonConcentric={ready:true,sample,dispose(){vfx.dispose();pipeline.dispose();}};sample(.1505);
</script></html>
