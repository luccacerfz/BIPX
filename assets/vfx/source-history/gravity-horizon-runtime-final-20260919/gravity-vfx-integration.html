<style>html,body{margin:0;overflow:hidden;background:#10212b;color:#e7e2f2;font:13px system-ui}header{position:fixed;top:18px;left:20px;right:20px;display:flex;pointer-events:none}header div{width:50%;padding:10px;background:#07151cc9;box-sizing:border-box}strong{display:block;font-size:17px;margin-bottom:4px}footer{position:fixed;bottom:16px;left:20px;background:#07151cd9;padding:9px;pointer-events:none}#panels{display:flex}#panels canvas{display:block;width:50vw;height:100vh}header{z-index:1}footer{z-index:1}</style>
<header><div><strong>ANTES · runtime preservado</strong>Mesmos assets, raio e câmera</div><div><strong>INTEGRADO · pool Horizon + nebula</strong>Wrapper runtime · fixture controlada</div></header><footer id="label"></footer>
<div id="panels"><canvas id="left"></canvas><canvas id="right"></canvas></div>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import {createCemetery} from '../src/render/cemetery.js';
import {getEnvironmentLayout,getEnvironmentColliders} from '../src/render/environment-layout.js';
import {loadAssetDressing} from '../src/render/asset-dressing.js';
import {loadPlayableCharacter} from '../src/assets/playable-characters.js';
import {loadMonsterLibrary} from '../src/assets/monster-library.js';
import {createClassSkillVfx as createBeforeVfx} from '../src/vfx-before/class-skill-vfx.js';
import {createClassSkillVfx} from '../src/vfx/class-skill-vfx.js';
import {shareEnvironmentCutawayDepth} from '../src/render/environment-cutaway.js';
import {createCinematicPipeline} from '../src/render/cinematic-pipeline.js';
const width=innerWidth/2,height=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(width,height);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;renderer.localClippingEnabled=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const panels=['left','right'].map(id=>{const c=document.getElementById(id);c.width=width;c.height=height;return c.getContext('2d',{alpha:false});});
const pipeline=createCinematicPipeline({THREE,renderer,adaptDepthMaterial:shareEnvironmentCutawayDepth});
const plainPipeline=createCinematicPipeline({THREE,renderer});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x172c34);scene.fog=new THREE.FogExp2(0x172c34,.012);scene.add(new THREE.HemisphereLight(0xa4cddc,0x233d3a,2.2));const moon=new THREE.DirectionalLight(0xb6dcf2,3.8);moon.position.set(-20,36,18);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);Object.assign(moon.shadow.camera,{near:1,far:95,left:-55,right:55,top:55,bottom:-55});moon.shadow.bias=-.0005;scene.add(moon);
const cemetery=createCemetery({THREE,scene}),ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),cemetery.groundMaterial);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const trees=getEnvironmentLayout().legacy.filter(c=>c.id.startsWith('tree')).map(c=>new THREE.Vector3(c.x,0,c.z));const world=await loadAssetDressing({THREE,scene,trees,lanterns:cemetery.lanternPositions});for(const p of cemetery.lanternPlaceholders)p.visible=false;
const heroGroup=new THREE.Group();heroGroup.position.set(-2,0,2);scene.add(heroGroup);const hero=await loadPlayableCharacter('dwarf',{THREE,parent:heroGroup});
const playerLight=new THREE.PointLight(0xffe2ab,5.2,24);playerLight.position.set(-2,4.5,2);scene.add(playerLight);
const library=await loadMonsterLibrary({THREE});const actors=[];
for(const [x,z]of [[0,-4],[-2.5,-5.6],[2.5,-2.6],[.8,-7.1]]){const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);actors.push({group,visual:library.create('zombie',{parent:group,height:2.55})});}
const camera=new THREE.PerspectiveCamera(48,(innerWidth/2)/innerHeight,.1,220);camera.position.set(-2,17,22);camera.lookAt(-2,1.2,-.6);
const baselineRoot=new THREE.Group();scene.add(baselineRoot);const baseline=createBeforeVfx({THREE,scene:baselineRoot,quality:'high'});const candidateRoot=new THREE.Group();scene.add(candidateRoot);const candidate=createClassSkillVfx({THREE,scene:candidateRoot,quality:'high'});
const center=new THREE.Vector3(0,0,-4);let time=0,quality='high',reduced=false,playing=false,fieldCount=1,offscreen=false,cutawayCompare=false;let fieldPositions=[center.clone()];
let renderCost={};
function renderSide(side,effect=true,copy=false){
 baselineRoot.visible=effect&&side===0&&!cutawayCompare;candidateRoot.visible=effect&&(side===1||cutawayCompare);
 const activePipeline=cutawayCompare&&side===0?plainPipeline:pipeline;
 activePipeline.render(scene,camera,0,candidateRoot.visible?candidate:null);renderCost={...renderer.info.render};
 if(copy)panels[side].drawImage(renderer.domElement,0,0);
}
function render(effect=true){
 for(let side=0;side<2;side++)renderSide(side,effect,true);
 document.querySelector('#label').textContent=`Fixture controlada com assets reais · HDR${quality==='high'?' + bloom':''} real · 1 renderer / 2 cópias canvas · t=${time.toFixed(2)} / 5 s · ${fieldCount} campos · raio 5 m · ${quality}${reduced?' / reduced':''}`;
}
function getFields(remaining){return remaining>0?fieldPositions.map((position,id)=>({id:`field-${id}`,position,radius:5,remaining,duration:5})):[];}
function step(dt,draw=true){time+=dt;const remaining=Math.max(0,5-time),fields=getFields(remaining);baseline.syncState({fields});baseline.update(dt);candidate.syncState({fields});candidate.update(dt);
 hero.update(dt,{speed:0,grounded:true});for(const a of actors)a.visual.update(dt,{speed:0});
 world.update(heroGroup.position,true,actors.map(a=>({health:1,mesh:a.group,radius:.6})),[],fields.map(f=>({...f,skillId:'dwarf_gravity_shot',castId:f.id})));if(draw)render();}
function setCount(count=1,outside=false){fieldCount=count;offscreen=outside;fieldPositions=Array.from({length:count},(_,i)=>new THREE.Vector3(center.x+(outside?1000:count===1?0:((i%4)-1.5)*3),0,center.z+(outside?1000:count===1?0:Math.floor(i/4)*4-2)));}
function sample(t,q='high',rm=false,count=fieldCount,outside=offscreen){playing=false;quality=q;reduced=rm;for(const p of [pipeline,plainPipeline]){p.setQuality(q);p.setReducedMotion(rm);}time=0;setCount(count,outside);for(const v of [baseline,candidate]){v.reset();v.setQuality(q);v.setReducedMotion(rm);}for(let i=0;i<t-1e-7;i+=1/60)step(Math.min(1/60,t-i),false);step(0);return stats();}
function stats(){return {time,quality,reduced,fieldCount,offscreen,camera:{fov:camera.fov,position:camera.position.toArray(),target:[-2,1.2,-.6],perPanelAspect:camera.aspect},baseline:baseline.getStats(),prototype:candidate.getStats().states.gravity,pipeline:pipeline.getStats(),world:world.stats,memory:{...renderer.info.memory},render:renderCost,glError:renderer.getContext().getError()};}
function pixels(){const data=new Uint8Array(width*height*4);renderer.getContext().readPixels(0,0,width,height,renderer.getContext().RGBA,renderer.getContext().UNSIGNED_BYTE,data);return data;}
function audit(){renderSide(1,false);const before=pixels();renderSide(1,true);const after=pixels();render();const result=[];
 for(const [index,a]of actors.entries()){
  const p=a.group.position.clone().add(new THREE.Vector3(0,1.7,0)).project(camera);let count=0,preserved=0;
  const cx=Math.round((p.x*.5+.5)*width),cy=Math.round((p.y*.5+.5)*height);
  for(let y=cy-5;y<=cy+5;y++)for(let x=cx-5;x<=cx+5;x++){if(x<0||x>=width||y<0||y>=height)continue;const i=(y*width+x)*4;const delta=Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2]);count++;if(delta<65)preserved++;}
  result.push({index,preservedFraction:count?preserved/count:null,pixels:count});
 }return result;
}
async function measureCost(){
 playing=false;const gl=renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');const cases=[];
 for(const [q,rm]of [['high',false],['low',true]])for(const [kind,count,outside]of [['baseline',1,false],['zero',0,false],['offscreen',8,true],['candidate',1,false],['candidate',4,false],['candidate',8,false]]){
  sample(1.8,q,rm,count,outside);const cpu=[],gpu=[];let disjoint=false;
  for(let i=0;i<30;i++){
   await new Promise(requestAnimationFrame);const query=ext?gl.createQuery():null;if(query)gl.beginQuery(ext.TIME_ELAPSED_EXT,query);
   const start=performance.now();renderSide(kind==='baseline'?0:1,true,false);cpu.push(performance.now()-start);
   if(query){gl.endQuery(ext.TIME_ELAPSED_EXT);while(!gl.getQueryParameter(query,gl.QUERY_RESULT_AVAILABLE))await new Promise(requestAnimationFrame);const bad=gl.getParameter(ext.GPU_DISJOINT_EXT);disjoint ||=bad;if(!bad)gpu.push(gl.getQueryParameter(query,gl.QUERY_RESULT)/1e6);gl.deleteQuery(query);}
  }
  const summary=a=>{a=a.slice(6).sort((a,b)=>a-b);return {samples:a.length,p50:a[Math.floor(a.length*.5)]??null,p95:a[Math.floor(a.length*.95)]??null,max:a.at(-1)??null};};
  cases.push({quality:q,reduced:rm,kind,count,outside,cpuSubmissionMs:summary(cpu),gpuElapsedMs:summary(gpu),gpuDisjoint:disjoint,pipeline:pipeline.getStats(),render:renderCost,prototype:candidate.getStats().states.gravity});
 }
 sample(1.8,'high',false,1,false);return {resolution:[width,height],timerQueryAvailable:!!ext,method:'30 renders per case; first 6 warmup discarded; no panel copies; candidate includes integrated shared depth',cases};
}
function scenario(name='center'){
 cutawayCompare=name!=='center';const layout=getEnvironmentLayout();
 const at=name==='tree'?layout.legacy.find(p=>p.id.startsWith('tree')):name==='ruin'?getEnvironmentColliders().find(p=>p.id==='ruined-wall-0'):null;
 center.set(at?at.x:0,0,at?at.z-2.5:-4);heroGroup.position.set(center.x-2,0,center.z+6);
 camera.position.set(center.x-2,17,center.z+26);camera.lookAt(center.x-2,1.2,center.z+3.4);camera.updateMatrixWorld();
 for(const [i,a]of actors.entries()){const offsets=[[0,0],[-2.5,-1.6],[2.5,1.4],[.8,-3.1]][i];a.group.position.set(center.x+offsets[0],0,center.z+offsets[1]);}
 document.querySelector('header div:first-child strong').textContent=cutawayCompare?'DEPTH SEM CUTAWAY · diagnóstico':'ANTES · runtime congelado';
 document.querySelector('header div:last-child strong').textContent=cutawayCompare?'DEPTH COM CUTAWAY · candidato':'INTEGRADO · pool Horizon + nebula';
 sample(1.8,'high',false,1,false);return {name,occluder:at??null,stats:stats()};
}
function lifecycle(){
 scenario();sample(1.8,'high',false,4);const before=candidate.getStats();const positionBefore=candidate.getStats().states.gravity.fields.map(f=>f.debris);
 for(let i=0;i<5;i++)step(0);const pause=candidate.getStats();
 camera.lookAt(camera.position.x,camera.position.y,camera.position.z+1000);camera.updateMatrixWorld();renderSide(1);const cameraAway=stats();camera.lookAt(center.x-2,1.2,center.z+3.4);camera.updateMatrixWorld();renderSide(1);const cameraBack=stats();
 const memory={...renderer.info.memory};for(let i=0;i<20;i++)sample(1.8,'high',false,(i%8)+1);const afterMemory={...renderer.info.memory};
 candidate.reset();baseline.reset();render();const reset={vfx:candidate.getStats(),pipeline:pipeline.getStats()};
 sample(5.3,'high',false,4);const expiry=stats();
 sample(1.8,'low',true,4);const reduced=candidate.getStats();sample(1.8,'high',false,1);return {before,pause,positionBefore,cameraAway,cameraBack,memory,afterMemory,reset,expiry,reduced};
}
window.gravityVfxPrototype={ready:true,sample,step,stats,audit,measureCost,scenario,lifecycle,play(q='high',rm=false){sample(0,q,rm,1,false);playing=true;},stop(){playing=false;},dispose(){baseline.dispose();candidate.dispose();render(false);pipeline.dispose();plainPipeline.dispose();return {baseline:baseline.getStats(),prototype:candidate.getStats()};}};
sample(1.8,'high',false,1);let previous=performance.now();function tick(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(playing){step(dt);if(time>=5.3)playing=false;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
